# Local AWS-mirror stack.
#
# The demo runs with none of this (mock LLM + networkx). Bring these up only when you
# want to exercise the production code paths locally at zero cloud cost.
#
#   docker compose up -d
#
# Then set the matching env vars (see .env.example) and rerun the pipeline.
#
# Mapping to AWS:
#   neo4j      -> Amazon Neptune
#   postgres   -> Amazon Aurora Postgres (with pgvector for retrieval)
#   ollama     -> Amazon Bedrock (Claude Haiku draft + Sonnet judge)
#   localstack -> the emulated AWS control plane (S3, Lambda, Step Functions, EventBridge)

services:
  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=fsbi
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    # after up:  docker exec -it <ollama> ollama pull llama3.2:3b   (draft)
    #            docker exec -it <ollama> ollama pull llama3.1:8b   (judge)

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,lambda,stepfunctions,events,sqs
      - DEBUG=0
